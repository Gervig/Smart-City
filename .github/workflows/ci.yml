name: CI

# Runs on every push and pull request to dev and main (and by hand from the Actions tab).
# Job 1 runs the unit tests and the integration tests in code.
# Job 2 starts the backend against a real PostgreSQL and runs the Postman collection with Newman (API tests).
# Job 3 starts the backend the same way and runs the Playwright end-to-end tests against the React frontend.
# Stress, load and spike tests are deliberately not part of this pipeline.
on:
  push:
    branches: [dev, main, casper-continous-integration] # TODO: remove the last branch after merging into dev
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-integration-tests:
    name: Unit and integration tests (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Surefire runs the unit tests, Failsafe runs the integration tests in the daos package.
      # The integration tests start PostgreSQL themselves with Testcontainers (Docker is available on the runner).
      - name: Run unit and integration tests
        run: mvn -B clean verify

      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: warn

  api-tests:
    name: API tests (Postman collection with Newman)
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_city
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The backend reads its settings from these variables when DEPLOYED is set (no config.properties needed).
    # It connects as the least-privilege application user created by SQL/users/08_users.sql, like in development.
    # ADMIN_PASSWORD must match adminPassword in postman/SmartCity.local.postman_environment.json.
    env:
      DEPLOYED: 'true'
      DB_NAME: smart_city
      CONNECTION_STR: jdbc:postgresql://localhost:5432/
      DB_USERNAME: smartcity_app
      DB_PASSWORD: app-dev-password
      ISSUER: smart-city-ci
      TOKEN_EXPIRE_TIME: '1800000'
      SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
      ADMIN_PASSWORD: Admin123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Hibernate only validates the schema, so the tables must exist before the backend starts.
      - name: Create the database schema
        run: >
          PGPASSWORD=postgres psql -h localhost -U postgres -d smart_city
          -v ON_ERROR_STOP=1 -f SQL/schema/database_schema.sql

      # Creates smartcity_app (used by the backend) and the other database users, with their privileges.
      - name: Create the database users
        run: >
          PGPASSWORD=postgres psql -h localhost -U postgres -d smart_city
          -v ON_ERROR_STOP=1 -f SQL/users/08_users.sql

      - name: Build the backend jar
        run: mvn -B -DskipTests package

      - name: Start the backend
        run: |
          nohup java -jar target/app.jar > app.log 2>&1 &
          echo "Waiting for the backend on port 7070..."
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/7070) 2>/dev/null; then echo "Backend is up"; exit 0; fi
            sleep 1
          done
          echo "Backend did not start in 60 seconds"; cat app.log; exit 1

      - name: Run the Postman collection
        run: >
          npx --yes newman@6 run postman/SmartCity.postman_collection.json
          -e postman/SmartCity.local.postman_environment.json
          --reporters cli,junit
          --reporter-junit-export newman-results.xml

      - name: Upload API test results and backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            newman-results.xml
            app.log
          if-no-files-found: warn

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_city
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The backend reads its settings from these variables when DEPLOYED is set (no config.properties needed).
    # It connects as the least-privilege application user created by SQL/users/08_users.sql, like in development.
    # ADMIN_PASSWORD must match adminPassword in postman/SmartCity.local.postman_environment.json.
    env:
      DEPLOYED: 'true'
      DB_NAME: smart_city
      CONNECTION_STR: jdbc:postgresql://localhost:5432/
      DB_USERNAME: smartcity_app
      DB_PASSWORD: app-dev-password
      ISSUER: smart-city-ci
      TOKEN_EXPIRE_TIME: '1800000'
      SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
      ADMIN_PASSWORD: Admin123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Hibernate only validates the schema, so the tables must exist before the backend starts.
      - name: Create the database schema
        run: >
          PGPASSWORD=postgres psql -h localhost -U postgres -d smart_city
          -v ON_ERROR_STOP=1 -f SQL/schema/database_schema.sql

      - name: Create the database users
        run: >
          PGPASSWORD=postgres psql -h localhost -U postgres -d smart_city
          -v ON_ERROR_STOP=1 -f SQL/users/08_users.sql

      - name: Build the backend jar
        run: mvn -B -DskipTests package

      - name: Start the backend
        run: |
          nohup java -jar target/app.jar > app.log 2>&1 &
          echo "Waiting for the backend on port 7070..."
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/7070) 2>/dev/null; then echo "Backend is up"; exit 0; fi
            sleep 1
          done
          echo "Backend did not start in 60 seconds"; cat app.log; exit 1

      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright starts the Vite dev server itself (see frontend/playwright.config.js). The frontend sends its
      # API requests to /backend, which Vite forwards to the backend on port 7070.
      - name: Run the end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload the Playwright report and backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
            app.log
          if-no-files-found: warn
