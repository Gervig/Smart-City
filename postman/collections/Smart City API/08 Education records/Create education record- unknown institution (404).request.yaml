$kind: http-request
name: "Create education record: unknown institution (404)"
url: "{{baseUrl}}/education-records"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "citizenId": {{citizenId}},
      "institutionId": 999999999,
      "startDate": "2005-08-15",
      "endDate": "2008-06-30"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Error body has an error message", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.be.a("string").and.not.empty;
      });
    language: text/javascript
order: 8000
