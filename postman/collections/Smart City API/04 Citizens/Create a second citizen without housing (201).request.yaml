$kind: http-request
url: "{{baseUrl}}/citizens"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Bo",
      "lastName": "Postmansen",
      "birthDate": "1990-05-17",
      "deathDate": null,
      "status": "alive",
      "gender": "male",
      "familyId": {{familyId}},
      "housingId": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Body is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Saves citizen2Id", function () {
          var json = pm.response.json();
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("citizen2Id", json.id);
      });
    language: text/javascript
order: 2000
