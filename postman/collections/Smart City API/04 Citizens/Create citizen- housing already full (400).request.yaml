$kind: http-request
name: "Create citizen: housing already full (400)"
url: "{{baseUrl}}/citizens"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Cecilie",
      "lastName": "Postmansen",
      "birthDate": "1990-05-17",
      "deathDate": null,
      "status": "alive",
      "gender": "female",
      "familyId": {{familyId}},
      "housingId": {{housingId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Error body has an error message", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.be.a("string").and.not.empty;
      });
      pm.test("Message says the housing is full", function () {
          pm.expect(pm.response.json().error.toLowerCase()).to.include("full");
      });
    language: text/javascript
order: 13000
