$kind: http-request
url: "{{baseUrl}}/citizens/{{citizenId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Body is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Has the expected fields", function () {
          var json = pm.response.json();
          pm.expect(json).to.include.keys("id", "firstName", "lastName", "birthDate", "status", "familyId");
          pm.expect(json.status).to.eql("alive");
      });
    language: text/javascript
order: 4000
