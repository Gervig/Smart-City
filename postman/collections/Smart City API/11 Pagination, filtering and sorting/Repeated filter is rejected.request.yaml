$kind: http-request
url: "{{baseUrl}}/families?familyName=a&familyName=b"
method: GET
queryParams:
  - key: familyName
    value: a
  - key: familyName
    value: b
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error does not leak internals", function () {
          var text = pm.response.text();
          pm.expect(text).to.not.include("Exception");
          pm.expect(text).to.not.include("org.hibernate");
          pm.expect(text).to.not.include("SELECT");
      });
    language: text/javascript
order: 27000
