$kind: http-request
url: "{{baseUrl}}/families?familyName=NoSuchFamilyXyz"
method: GET
queryParams:
  familyName: NoSuchFamilyXyz
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test("empty result", function () {
          pm.expect(json.data).to.eql([]);
          pm.expect(json.totalElements).to.eql(0);
      });
    language: text/javascript
order: 11000
