$kind: http-request
url: "{{baseUrl}}/families"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"familyName": "PgTest-C"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.collectionVariables.set("pgFamily3", pm.response.json().id);
    language: text/javascript
order: 3000
