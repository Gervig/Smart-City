$kind: http-request
name: Huge page * size is rejected
url: "{{baseUrl}}/families?page=2147483647&size=100"
method: GET
queryParams:
  page: "2147483647"
  size: "100"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error does not leak internals", function () {
          var text = pm.response.text();
          pm.expect(text).to.not.include("Exception");
          pm.expect(text).to.not.include("org.hibernate");
          pm.expect(text).to.not.include("SELECT");
      });
    language: text/javascript
order: 21000
