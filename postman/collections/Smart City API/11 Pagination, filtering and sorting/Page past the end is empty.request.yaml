$kind: http-request
url: "{{baseUrl}}/families?familyName=PgTest&size=2&page=5"
method: GET
queryParams:
  familyName: PgTest
  size: "2"
  page: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test("empty data but totals kept", function () {
          pm.expect(json.data.length).to.eql(0);
          pm.expect(json.totalElements).to.eql(3);
      });
    language: text/javascript
order: 7000
