$kind: http-request
name: "Citizens: filter on lastName + sort"
url: "{{baseUrl}}/citizens?lastName=Postmansen&sort=firstName,asc"
method: GET
queryParams:
  lastName: Postmansen
  sort: firstName,asc
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test("postman citizens found", function () {
          pm.expect(json.totalElements).to.be.above(0);
      });
    language: text/javascript
order: 14000
