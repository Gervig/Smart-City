$kind: http-request
name: "Citizens: birth date range"
url: "{{baseUrl}}/citizens?birthDateFrom=1990-01-01&birthDateTo=1990-12-31"
method: GET
queryParams:
  birthDateFrom: 1990-01-01
  birthDateTo: 1990-12-31
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test("range returns an envelope", function () {
          pm.expect(json.data).to.be.an("array");
      });
    language: text/javascript
order: 15000
