$kind: http-request
url: "{{baseUrl}}/families?familyName=PgTest&size=2&page=1"
method: GET
queryParams:
  familyName: PgTest
  size: "2"
  page: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test("last page has 1 row", function () {
          pm.expect(json.data.length).to.eql(1);
          pm.expect(json.page).to.eql(1);
      });
    language: text/javascript
order: 6000
