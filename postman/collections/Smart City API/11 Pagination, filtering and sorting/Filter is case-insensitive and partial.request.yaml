$kind: http-request
url: "{{baseUrl}}/families?familyName=pgtest-a"
method: GET
queryParams:
  familyName: pgtest-a
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.test("one match", function () {
          pm.expect(json.totalElements).to.eql(1);
          pm.expect(json.data[0].familyName).to.eql("PgTest-A");
      });
    language: text/javascript
order: 10000
