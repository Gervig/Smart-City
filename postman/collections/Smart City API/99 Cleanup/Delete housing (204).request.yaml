$kind: http-request
url: "{{baseUrl}}/housings/{{housingId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 204", function () {
          pm.response.to.have.status(204);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
    language: text/javascript
order: 10000
