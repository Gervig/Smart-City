$kind: http-request
url: "{{baseUrl}}/locations/{{locationId}}/nearby"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Says there are no coordinates", function () {
          pm.expect(pm.response.json().error).to.include("coordinates");
      });
    language: text/javascript
order: 2000
