$kind: http-request
name: "Citizen details with invalid token (401)"
url: "{{baseUrl}}/citizen-details"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: 'pm.request.headers.add({key: "Authorization", value: "Bearer invalid-token"});'
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Response time is below 1500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
    language: text/javascript
order: 11000
