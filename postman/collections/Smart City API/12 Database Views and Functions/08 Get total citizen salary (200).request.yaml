$kind: http-request
name: "Get total citizen salary (200)"
url: "{{baseUrl}}/citizens/1/total-salary"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: 'pm.request.headers.add({key: "Authorization", value: "Bearer {{adminToken}}"});'
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Salary response is numeric", function () {
          pm.expect(pm.response.json()).to.be.a("number");
      });
      pm.test("Salary is not negative", function () {
          pm.expect(pm.response.json()).to.be.at.least(0);
      });
      pm.test("Response time is below 1500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
    language: text/javascript
order: 8000
