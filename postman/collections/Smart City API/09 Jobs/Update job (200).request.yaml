$kind: http-request
url: "{{baseUrl}}/jobs/{{jobId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "citizenId": {{citizenId}},
      "companyId": {{companyId}},
      "institutionId": null,
      "title": "Senior developer",
      "salary": 45000,
      "startDate": "2015-09-01",
      "endDate": null,
      "status": "active"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: 'pm.request.headers.upsert({key: "Authorization", value: "Bearer " + pm.collectionVariables.get("adminToken")});'
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Body is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
    language: text/javascript
order: 4000
