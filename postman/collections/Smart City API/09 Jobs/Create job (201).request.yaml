$kind: http-request
url: "{{baseUrl}}/jobs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "citizenId": {{citizenId}},
      "companyId": {{companyId}},
      "institutionId": null,
      "title": "Developer",
      "salary": 35000,
      "startDate": "2015-09-01",
      "endDate": null,
      "status": "active"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: 'pm.request.headers.upsert({key: "Authorization", value: "Bearer " + pm.collectionVariables.get("adminToken")});'
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Body is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Saves jobId", function () {
          var json = pm.response.json();
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("jobId", json.id);
      });
    language: text/javascript
order: 1000
