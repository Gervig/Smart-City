$kind: http-request
url: "{{baseUrl}}/locations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test Location",
      "streetAddress": "R\u00e5dhuspladsen 1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Body is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Saves locationId", function () {
          var json = pm.response.json();
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("locationId", json.id);
      });
    language: text/javascript
order: 1000
