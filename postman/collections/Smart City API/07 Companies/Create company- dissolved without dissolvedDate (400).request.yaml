$kind: http-request
name: "Create company: dissolved without dissolvedDate (400)"
url: "{{baseUrl}}/companies"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "locationId": {{locationId}},
      "name": "Postman Ltd",
      "foundedDate": "2001-03-04",
      "dissolvedDate": null,
      "status": "dissolved"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Error body has an error message", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.be.a("string").and.not.empty;
      });
    language: text/javascript
order: 7000
