$kind: http-request
url: "{{baseUrl}}/companies"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Body is a page envelope", function () {
          var json = pm.response.json();
          pm.expect(json.data).to.be.an("array");
          pm.expect(json.data.length).to.be.above(0);
          pm.expect(json.page).to.be.a("number");
          pm.expect(json.size).to.be.a("number");
          pm.expect(json.totalElements).to.be.a("number");
          pm.expect(json.totalPages).to.be.a("number");
      });
    language: text/javascript
order: 2000
