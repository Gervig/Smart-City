$kind: http-request
url: "{{baseUrl}}/citizen-relationships/{{relationshipId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Body is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Links the two citizens", function () {
          var json = pm.response.json();
          pm.expect(json.citizenId1).to.eql(pm.collectionVariables.get("citizenId"));
          pm.expect(json.citizenId2).to.eql(pm.collectionVariables.get("citizen2Id"));
      });
    language: text/javascript
order: 2000
