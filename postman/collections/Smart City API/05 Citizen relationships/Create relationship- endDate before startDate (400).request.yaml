$kind: http-request
name: "Create relationship: endDate before startDate (400)"
url: "{{baseUrl}}/citizen-relationships"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "citizenId1": {{citizenId}},
      "citizenId2": {{citizen2Id}},
      "relationshipType": "marriage",
      "startDate": "2015-06-01",
      "endDate": "2000-01-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Error body has an error message", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.be.a("string").and.not.empty;
      });
    language: text/javascript
order: 8000
