$kind: http-request
name: Secured endpoint without token (401/403)
url: "{{baseUrl}}/api/secured/demo"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is one of 401, 403", function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 403]);
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
    language: text/javascript
order: 6000
