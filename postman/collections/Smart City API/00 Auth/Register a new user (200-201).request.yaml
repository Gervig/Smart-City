$kind: http-request
name: Register a new user (200/201)
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "Password123"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("username", "postman_" + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is one of 200, 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test("Body is JSON", function () {
          pm.response.to.be.json;
      });
      pm.test("Response time is below 1500 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      pm.test("Returns the username and a roles array", function () {
          var json = pm.response.json();
          pm.expect(json.username).to.eql(pm.collectionVariables.get("username"));
          pm.expect(json.roles).to.be.an("array");
      });
    language: text/javascript
order: 1000
